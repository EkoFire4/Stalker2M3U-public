name: Notify Test repo on .m3u changes

on:
  push:
    branches: [ main ]
    paths:
      - '*.m3u'               # Chỉ kích hoạt khi có file .m3u thay đổi

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to Love4vn/Test
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.TEST_REPO_PAT }}" \
            https://api.github.com/repos/Love4vn/Test/dispatches \
            -d '{"event_type":"m3u-updated"}'
